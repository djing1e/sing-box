name: Build ARM64 ML-KEM

on:
  push:
    branches:
      - v1.12.17-mlkem
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: Show Go version
        run: |
          go version
          grep -E '^(go|toolchain) ' go.mod || true

      - name: Build sing-box ARM64 with ML-KEM
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          TAGS="with_clash_api,with_gvisor,with_quic,with_tailscale,with_utls,with_wireguard"

          go build \
            -v \
            -trimpath \
            -tags "$TAGS" \
            -ldflags="-s -w -buildid= -X github.com/sagernet/sing-box/constant.Version=1.12.17-mlkem.2" \
            -o sing-box-mlkem \
            ./cmd/sing-box

      - name: Verify and package
        run: |
          set -eu

          echo "===== FILE ====="
          file sing-box-mlkem

          echo "===== VERSION ====="
          strings sing-box-mlkem | grep -F '1.12.17-mlkem.2'
          go version -m sing-box-mlkem

          echo "===== SIZE ====="
          ls -lh sing-box-mlkem
          stat -c '%s bytes' sing-box-mlkem

          echo "===== SHA256 ====="
          sha256sum sing-box-mlkem

          echo "===== PACKAGE ====="
          cp sing-box-mlkem sing-box-linux-arm64
          chmod 755 sing-box-linux-arm64

          gzip -9 -n -c sing-box-linux-arm64 > sing-box-linux-arm64.gz

          sha256sum             sing-box-linux-arm64             sing-box-linux-arm64.gz             > SHA256SUMS

          gzip -t sing-box-linux-arm64.gz

          echo "===== RELEASE FILES ====="
          wc -c sing-box-linux-arm64 sing-box-linux-arm64.gz
          cat SHA256SUMS

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-1.12.17-mlkem.2-linux-arm64
          path: |
            sing-box-linux-arm64
            sing-box-linux-arm64.gz
            SHA256SUMS
          compression-level: 0
